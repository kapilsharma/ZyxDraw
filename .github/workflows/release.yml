name: Release

# Push a tag equal to the version in manifest.json (for example 0.1.0, no "v").
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # For the build provenance attestation (recommended for the community plugin directory).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $version"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --draft --title "${GITHUB_REF_NAME}" --generate-notes
